# Sanctioned vessels (OFAC SDN + UK Sanctions List, by IMO number) for the map's ship layer.
# Weekly, or by hand (Actions → "Sanctioned vessels" → Run workflow). Writes public/data/sanctioned-vessels.json.
name: Sanctioned vessels
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest tools/sanctions/test_build.py -v
      - name: Build
        run: python tools/sanctions/build_sanctions.py
      - name: Commit
        run: |
          git config user.name "sanctions-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/sanctioned-vessels.json
          git diff --cached --quiet || git commit -m "Data: sanctioned vessels (OFAC, UK)"
          git push
