# Airfields and ports of the Middle East (without Israel) for the map's "Airfields & ports" section.
# OurAirports + NGA World Port Index → public/data/airfields.geojson and public/data/ports.geojson.
# Monthly, or by hand (Actions → "Airfields and ports data" → Run workflow).
name: Airfields and ports data
on:
  schedule:
    - cron: '17 3 2 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest tools/infra/test_build.py -v
      - name: Build
        # Exit 2 = airfields written, ports kept from the last run (commit, then fail visibly).
        # Exit 3 = airfields failed, nothing written (fail now).
        run: |
          set +e
          python tools/infra/build_infra.py
          code=$?
          if [ "$code" = "2" ]; then echo "PORTS_FAILED=1" >> "$GITHUB_ENV"; exit 0; fi
          exit $code
      - name: Commit
        run: |
          git config user.name "infra-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/airfields.geojson public/data/ports.geojson 2>/dev/null || git add public/data/airfields.geojson
          git diff --cached --quiet || git commit -m "Data: airfields and ports (OurAirports, NGA WPI)"
          git push
      - name: Ports status
        if: env.PORTS_FAILED == '1'
        run: echo "::error::World Port Index could not be read; ports.geojson was not updated (see the Build step log for the reason and the per-country counts)" && exit 1
