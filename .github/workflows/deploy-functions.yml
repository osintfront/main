# Deploys the Supabase Edge Functions a push to main changes — including every function that imports a
# changed _shared file (tools/functions/affected.mjs). By hand: Actions → "Deploy Edge Functions" →
# Run workflow, with function names (space-separated) or "all".
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
# Each function keeps its current "Verify JWT" setting; a brand-new function gets the CLI default (on).
name: Deploy Edge Functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
    inputs:
      functions:
        description: 'Function names, space-separated, or "all"'
        required: true
concurrency:
  group: deploy-functions
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_REF: kbfggmvrfevstzneqfzf
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: node --experimental-strip-types --test tests/infra/affectedFunctions.test.ts
      - name: Which functions
        id: which
        env:
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ github.event.inputs.functions }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$INPUT" = "all" ]; then
              list=$(node tools/functions/affected.mjs $(git ls-files 'supabase/functions/*/index.ts'))
            else
              list="$INPUT"
            fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            list=""
          else
            list=$(node tools/functions/affected.mjs $(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- supabase/functions))
          fi
          list=$(echo $list)
          echo "Functions: ${list:-none}"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Check the secret
        if: steps.which.outputs.list != ''
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is missing"; exit 1
          fi
      - uses: supabase/setup-cli@v1
        if: steps.which.outputs.list != ''
        with:
          version: latest
      - name: Deploy
        if: steps.which.outputs.list != ''
        env:
          LIST: ${{ steps.which.outputs.list }}
        run: |
          set -euo pipefail
          # Current Verify JWT settings, so a deploy never flips them.
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions" > current.json
          # The CLI wants a config file; the repo has none (the project is not linked), so a minimal one.
          [ -f supabase/config.toml ] || printf 'project_id = "osintfront"\n' > supabase/config.toml
          for fn in $LIST; do
            if ! [[ "$fn" =~ ^[a-z0-9_-]+$ ]] || [ ! -f "supabase/functions/$fn/index.ts" ]; then
              echo "::error::No function folder: $fn"; exit 1
            fi
            verify=$(node -e 'const a=require("./current.json");const f=a.find(x=>x.slug===process.argv[1]);console.log(f?String(f.verify_jwt):"new")' "$fn")
            flag=""
            [ "$verify" = "false" ] && flag="--no-verify-jwt"
            echo "::group::$fn (verify_jwt: $verify)"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api $flag
            echo "::endgroup::"
          done
