# Forecast clouds and rain for the map's weather timeline (NOAA GFS 0.25°, +1…+72 h, Middle East box).
# Renders one PNG per hour per layer into the public Supabase Storage bucket "weather" and writes
# gfs/latest.json. Runs ~3h40m after each GFS cycle; can be run by hand (Actions → "GFS frames" → Run workflow).
# Needs the repository secret SUPABASE_SERVICE_ROLE_KEY.
name: GFS frames
on:
  schedule:
    - cron: '40 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gfs-frames
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/gfs/requirements.txt
      - run: pip install -r tools/gfs/requirements.txt
      - name: Tests
        run: python -m unittest tools/gfs/test_render.py -v
      - name: Render and upload
        env:
          SUPABASE_URL: https://kbfggmvrfevstzneqfzf.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/gfs/render_frames.py
