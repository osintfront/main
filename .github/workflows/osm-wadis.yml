# Lebanon's waterways and valleys (named and unnamed) from OpenStreetMap (Geofabrik extract), as GeoJSON lines.
# The file is read by event-agent {action:"osm_wadis", band:"file"} → osm_waterways → wadi_lines.
# Run by hand (Actions → "OSM wadis" → Run workflow) to refresh.
name: OSM wadis (Lebanon)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool jq
      - name: Download Lebanon extract
        run: curl -sSfL -o lebanon.osm.pbf https://download.geofabrik.de/asia/lebanon-latest.osm.pbf
      - name: Waterways and valleys → GeoJSON lines
        run: |
          mkdir -p data/osm
          osmium tags-filter lebanon.osm.pbf w/waterway=river,stream,wadi w/natural=valley -o lines.osm.pbf --overwrite
          osmium export lines.osm.pbf -f geojsonseq --geometry-types=linestring -a id -o lines.geojsonseq --overwrite
          # Named and unnamed (most of Lebanon's streams carry no name tag); only the fields the import uses;
          # coordinates to 5 decimals (~1 m) to keep the file small.
          jq -c '{id: (.properties["@id"] // .id), p: {name: .properties.name, ar: .properties["name:ar"], en: .properties["name:en"], he: .properties["name:he"], waterway: .properties.waterway, natural: .properties.natural}, c: [.geometry.coordinates[] | [(.[0]*1e5|round/1e5), (.[1]*1e5|round/1e5)]]}' \
            < <(sed 's/^\x1e//' lines.geojsonseq) > data/osm/lebanon-waterways.jsonl
          wc -l data/osm/lebanon-waterways.jsonl
      - name: Commit
        run: |
          git config user.name "osm-wadis bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/osm/lebanon-waterways.jsonl
          git diff --cached --quiet || git commit -m "OSM: Lebanon waterways and valleys"
          git push
